<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% load static %}
    <link rel="stylesheet" href={% static 'd38_tempconverter/styles.css'  %} />
    <link rel="shortcut icon" type="image/x-icon"  href={% static 'd38_tempconverter/favicon.ico'  %} />
  </head>
  <body>
    <div class="container">
      <div class="row d-flex justify-content-center mt-5"> 
        <div class="col-md-6">
          <h1 class="text-center fw-border display-3 bg-dark text-white py-3">Temperature Converter</h1>
          <hr />
          <form>
            <p class="alert alert-info">Type a value in any field to convert Temperature.</p>
            <div class="mb-3">
              <label for="F" class="form-label">Farenheit</label>
              <input id="F" class="form-control form-control-lg" type="number" placeholder="F"></input>
            </div>
            <div class="mb-3">
              <label for="C" class="form-label">Celsius</label>
              <input id="C" class="form-control form-control-lg" type="number" placeholder="C"></input>
            </div>
            <div class="mb-3">
              <label for="K" class="form-label">Kelvin</label>
              <input id="K" class="form-control form-control-lg" type="number" placeholder="K"></input>
            </div>
          </form>
        </div>
      </div>
    </div>
    
    <script src="{% static 'd38_tempconverter/script.js' %}"></script>
  </body>
</html>
