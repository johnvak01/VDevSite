<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% load static %}
    <link rel="stylesheet" href={% static 'd45_wikisearch/styles.css'  %} />
    <link rel="shortcut icon" type="image/x-icon"  href={% static 'd45_wikisearch/favicon.ico'  %} />
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col text-center">
          <img src={% static 'd45_wikisearch/wiki.png' %} alt="wiki" class="my-5"></img>
          <form class="d-flex">
            <input type="text" placeholder="Search" class="form-control form-control-lg p-3 border rounded-pill border-success">
            </input>
            <button class="btn ms-2">
              <i class="bi bi-search"></i>
            </button>
          </form>
          <hr class="hide">
        </div>
      </div>
    </div>
    <section>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col">
            <div class="results py-3">
              <p class="alert alert-danger text-center hide">Error</p>
              
              <!-- single result-->
              <div class="result p-2">
                <a href="" target="_blank" ref="noopener" class="h3 fw-bold">Title</a>
                <br>
                <a href="" target="_blank" ref="noopener" class="fs-5 text-success">https://link.com</a>
                <p class="fs-5">lorem ipsum</p>
              </div>
            </div> 
          </div>
        </div>
      </div>
    </section>
    <script type= "module" src={% static 'd45_wikisearch/script.js' %}></script>
  </body>
</html>
