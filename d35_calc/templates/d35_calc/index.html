<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% load static %}
    <link rel="stylesheet" href={% static 'd35_calc/styles.css'  %} />
    <link rel="shortcut icon" type="image/x-icon"  href={% static 'd35_calc/favicon.ico'  %} />
  </head>
  <body>
    <section>
      <div class="container box">
        <div class="calc">
          <div class="result">
            <p></p>
          </div>
          <div class="clear">C</div>
          <ul class="number-div keys">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>+</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li>*</li>
            <li>7</li>
            <li>8</li>
            <li>9</li>
            <li>-</li>
            <li>0</li>
            <li>.</li>
            <li class="equals">=</li>
            <li>/</li>
          </ul>
        </div>
      </div>
      
    </section>
    <script src="{% static 'd35_calc/script.js' %}"></script>
  </body>
</html>
