<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% load static %}
    <link rel="stylesheet" href={% static 'd40_wordcount/styles.css'  %} />
    <link rel="shortcut icon" type="image/x-icon"  href={% static 'd40_wordcount/favicon.ico'  %} />
  </head>
  <body>
    <section>
      <div class="container">
        <div class="row d-flex justify-content-center">
          <div class="col-md-8 border-primary">
            <h1 class="text-center display-3 fw-bolder py-3">Word Counter</h1>
            <textarea cols="30" rows="10" class="form-control fs-3 input"></textarea>
          </div>
        </div>
        <div class="row d-flex justify-content-center my-3 g-3">
          <div class="row col-md-4 border border-primary py-3">
            <h3>Character: <span class="character">0</span></h3>
          </div>
          <div class="w-100"></div>
          <div class="row col-md-4 border border-primary py-3">
            <h3>Words: <span class="word">0</span></h3>
          </div>
        </div>
        <div class="row d-flex justify-content-center my-3 g-3">
          <div class="row col-md-4 border border-primary py-3">
            <h3>Word Limit: <span class="word-limit">0</span></h3>
          </div>
          <div class="w-100"></div>
          <div class="row col-md-4 border border-primary py-3">
            <h3>Avg Read Time: <span class="read-time">0</span></h3>
          </div>
        </div>
      </div>
    </section>
    <script src="{% static 'd40_wordcount/script.js' %}"></script>
  </body>
</html>
